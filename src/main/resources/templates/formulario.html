<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout-fragments :: head('Nota - Cafeeira 2 Irmãos')">
</head>
<body>
<header th:replace="layout-fragments :: cabecalho"></header>

<main class="container container-form">

    <section class="painel-form">
        <h1 th:text="${nota.id == null ? 'Nova Nota' : 'Editar Nota ' + nota.numero}">Nova Nota</h1>

        <form th:action="${nota.id == null} ? @{/notas} : @{/notas/{id}(id=${nota.id})}"
              th:object="${nota}" method="post">

            <div class="linha-campos">
                <div class="campo campo-largo">
                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" th:field="*{nome}" placeholder="Nome do cliente">
                    <span class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                </div>
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" th:field="*{telefone}" placeholder="(00) 00000-0000">
                </div>
            </div>

            <div class="linha-campos">
                <div class="campo campo-largo">
                    <label for="linha">Linha</label>
                    <input type="text" id="linha" th:field="*{linha}" placeholder="Linha / Comunidade">
                </div>
            </div>

            <div class="linha-campos">
                <div class="campo campo-largo">
                    <label for="observacoes">Obs</label>
                    <input type="text" id="observacoes" th:field="*{observacoes}" placeholder="Observações">
                </div>
            </div>

            <div class="linha-campos quatro">
                <div class="campo">
                    <label for="sacas">Sacas *</label>
                    <input type="number" step="0.01" min="0" id="sacas" th:field="*{sacas}">
                    <span class="erro" th:if="${#fields.hasErrors('sacas')}" th:errors="*{sacas}"></span>
                </div>
                <div class="campo">
                    <label for="quilos">Quilos *</label>
                    <input type="number" step="0.01" min="0" id="quilos" th:field="*{quilos}">
                    <span class="erro" th:if="${#fields.hasErrors('quilos')}" th:errors="*{quilos}"></span>
                </div>
                <div class="campo">
                    <label for="umidade">Umidade *</label>
                    <input type="number" step="0.01" min="0" id="umidade" th:field="*{umidade}">
                    <span class="erro" th:if="${#fields.hasErrors('umidade')}" th:errors="*{umidade}"></span>
                </div>
                <div class="campo">
                    <label for="data">Data *</label>
                    <input type="date" id="data" th:field="*{data}">
                    <span class="erro" th:if="${#fields.hasErrors('data')}" th:errors="*{data}"></span>
                </div>
            </div>

            <div class="linha-campos">
                <div class="campo campo-largo">
                    <label for="assinatura">Ass. do Maquinista</label>
                    <input type="text" id="assinatura" th:field="*{assinatura}" placeholder="Assinatura do maquinista">
                </div>
            </div>

            <div class="acoes-form">
                <button type="submit" class="botao botao-principal">💾 Salvar nota</button>
                <a th:href="@{/notas}" class="botao botao-secundario">Cancelar</a>
            </div>
        </form>
    </section>

</main>
</body>
</html>
